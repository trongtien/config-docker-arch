# Đổi phím kích hoạt (Prefix) sang Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Đánh số window và pane từ 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Bật chuột và tối ưu màu sắc cho Neovim
set -g mouse on
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 100000

# Phím tắt chia màn hình (giữ nguyên đường dẫn)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Load lại cấu hình nhanh
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded!"

# Di chuyển giữa các ô bằng Ctrl + h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Giao diện thanh trạng thái (Status Bar)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold]    #S #[bg=default,fg=default] "
set -g status-right "#[fg=#a6adc8] %Y-%m-%d │ %H:%M "
set -g window-status-current-format "#[bg=#45475a,fg=#89b4fa,bold] #I:#W* "
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
